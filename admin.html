<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Mechanic — Admin</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2d3d;
      --accent: #ff6b35;
      --green: #22c55e;
      --text: #e2e8f0;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Login */
    #login { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 320px; text-align: center; }
    .login-card h1 { font-size: 1.2rem; margin-bottom: 6px; }
    .login-card p { color: var(--muted); font-size: 0.875rem; margin-bottom: 24px; }
    .login-card input { width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; margin-bottom: 12px; outline: none; }
    .login-card input:focus { border-color: var(--accent); }
    .login-card button { width: 100%; padding: 10px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .login-card button:hover { opacity: 0.9; }
    .error { color: #ef4444; font-size: 0.875rem; margin-top: 10px; min-height: 20px; }

    /* Dashboard */
    #dashboard { display: none; }
    header { padding: 18px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1rem; letter-spacing: 0.02em; }
    .brand { color: var(--accent); font-weight: 700; }
    .logout { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .logout:hover { border-color: var(--text); color: var(--text); }

    main { padding: 28px 32px; max-width: 1200px; margin: 0 auto; }

    /* Cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; }
    .card .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 8px; }
    .card .value { font-size: 2rem; font-weight: 700; line-height: 1; }
    .card .sub { font-size: 0.8rem; color: var(--muted); margin-top: 5px; }
    .card.accent .value { color: var(--accent); }
    .card.green .value { color: var(--green); }

    /* Sections */
    .section { margin-bottom: 28px; }
    .section h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 12px; }

    /* Chart */
    .chart-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 20px 10px; }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 110px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .bar { width: 100%; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: 0.8; cursor: default; }
    .bar:hover { opacity: 1; }
    .bar-label { font-size: 0.55rem; color: var(--muted); transform: rotate(-45deg); white-space: nowrap; margin-top: 2px; }

    /* Two-col grid */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }

    /* Split bar */
    .split-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.875rem; }
    .split-bar { height: 10px; border-radius: 5px; overflow: hidden; display: flex; }
    .split-bar .m { background: var(--green); }
    .split-bar .g { flex: 1; background: var(--border); }
    .split-labels { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); margin-top: 5px; }

    /* Table */
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 10px 14px; text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); border-bottom: 1px solid var(--border); }
    td { padding: 10px 14px; font-size: 0.875rem; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .bar-inline { height: 4px; background: var(--accent); border-radius: 2px; margin-top: 4px; opacity: 0.5; }

    /* Recent */
    .query-list { display: flex; flex-direction: column; gap: 8px; }
    .query-item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
    .q-tag { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .q-tag.manual { background: rgba(34,197,94,0.12); color: var(--green); }
    .q-tag.general { background: rgba(100,116,139,0.12); color: var(--muted); }
    .q-moto { flex: 1; font-size: 0.875rem; }
    .q-time { font-size: 0.75rem; color: var(--muted); }

    /* Loading */
    .loading { color: var(--muted); font-size: 0.875rem; padding: 20px 0; }

    @media (max-width: 700px) {
      main { padding: 16px; }
      header { padding: 14px 16px; }
      .two-col { grid-template-columns: 1fr; }
      .bars { gap: 2px; }
    }
  </style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>🔧 Virtual Mechanic</h1>
    <p>Panel de administración</p>
    <input type="password" id="pwdInput" placeholder="Contraseña" autocomplete="current-password" />
    <button onclick="login()">Entrar</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<div id="dashboard">
  <header>
    <h1><span class="brand">VM</span> &nbsp;Admin</h1>
    <button class="logout" onclick="logout()">Cerrar sesión</button>
  </header>
  <main>
    <div class="cards" id="cards"><p class="loading">Cargando...</p></div>

    <div class="section">
      <h2>Consultas por día — últimos 30 días</h2>
      <div class="chart-wrap"><div class="bars" id="barsChart"></div></div>
    </div>

    <div class="two-col">
      <div class="section" style="margin:0">
        <h2>Manual oficial vs Conocimiento general</h2>
        <div class="card" id="splitCard"></div>
      </div>
      <div class="section" style="margin:0">
        <h2>Modelos más consultados</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Moto</th><th style="text-align:right">Consultas</th></tr></thead>
            <tbody id="brandsTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Sin manual — para revisar</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Moto</th><th style="text-align:right">Veces sin manual</th></tr></thead>
          <tbody id="sinManualTable"></tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <h2>Últimas consultas</h2>
      <div class="query-list" id="queryList"></div>
    </div>
  </main>
</div>

<script>
const API = '/api/admin';
let password = sessionStorage.getItem('vm_admin_pwd') || '';

function timeAgo(ms) {
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return 'hace ' + s + 's';
  if (s < 3600) return 'hace ' + Math.floor(s / 60) + 'min';
  if (s < 86400) return 'hace ' + Math.floor(s / 3600) + 'h';
  return 'hace ' + Math.floor(s / 86400) + 'd';
}

async function login() {
  const input = document.getElementById('pwdInput');
  const pwd = input.value.trim();
  if (!pwd) return;
  document.getElementById('loginError').textContent = '';
  try {
    const res = await fetch(API, { headers: { 'x-admin-password': pwd } });
    if (res.status === 401) { document.getElementById('loginError').textContent = 'Contraseña incorrecta'; return; }
    password = pwd;
    sessionStorage.setItem('vm_admin_pwd', pwd);
    renderDashboard(await res.json());
  } catch {
    document.getElementById('loginError').textContent = 'Error de conexión';
  }
}

function logout() {
  sessionStorage.removeItem('vm_admin_pwd');
  password = '';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('pwdInput').value = '';
}

async function loadDashboard() {
  if (!password) return;
  try {
    const res = await fetch(API, { headers: { 'x-admin-password': password } });
    if (res.status === 401) { logout(); return; }
    renderDashboard(await res.json());
  } catch {
    // red error, keep showing last rendered state
  }
}

function renderDashboard(data) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  const manualPct = data.total > 0 ? Math.round(data.manual / data.total * 100) : 0;

  // Cards
  document.getElementById('cards').innerHTML = `
    <div class="card accent">
      <div class="label">Total consultas</div>
      <div class="value">${data.total.toLocaleString('es')}</div>
    </div>
    <div class="card">
      <div class="label">Hoy</div>
      <div class="value">${data.today}</div>
    </div>
    <div class="card green">
      <div class="label">Con manual oficial</div>
      <div class="value">${manualPct}%</div>
      <div class="sub">${data.manual} de ${data.total} consultas</div>
    </div>
    <div class="card">
      <div class="label">Sin manual</div>
      <div class="value">${data.general}</div>
      <div class="sub">respondido con conocimiento general</div>
    </div>
  `;

  // Bar chart
  const maxCount = Math.max(...data.days.map(d => d.count), 1);
  document.getElementById('barsChart').innerHTML = data.days.map(d => {
    const h = Math.max(Math.round((d.count / maxCount) * 100), d.count > 0 ? 4 : 2);
    return `<div class="bar-col">
      <div class="bar" style="height:${h}px" title="${d.date}: ${d.count}"></div>
      <div class="bar-label">${d.date.slice(5)}</div>
    </div>`;
  }).join('');

  // Manual / General split
  document.getElementById('splitCard').innerHTML = `
    <div class="split-row"><span>Manual oficial</span><strong style="color:var(--green)">${data.manual}</strong></div>
    <div class="split-row"><span>Conocimiento general</span><strong style="color:var(--muted)">${data.general}</strong></div>
    <div class="split-bar">
      <div class="m" style="width:${manualPct}%"></div>
      <div class="g"></div>
    </div>
    <div class="split-labels"><span>Manual ${manualPct}%</span><span>General ${100 - manualPct}%</span></div>
  `;

  // Brands table
  const maxB = data.brands.length > 0 ? data.brands[0].count : 1;
  document.getElementById('brandsTable').innerHTML = data.brands.slice(0, 10).map(b => {
    const parts = b.name.split('|');
    const w = Math.round(b.count / maxB * 100);
    return `<tr>
      <td><strong>${parts[0]}</strong>${parts[1] ? ' ' + parts[1] : ''}<div class="bar-inline" style="width:${w}%"></div></td>
      <td style="text-align:right">${b.count}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="2" style="color:var(--muted);text-align:center">Sin datos aún</td></tr>';

  // Sin manual: agregado por marca+modelo+año, ordenado por frecuencia (ya viene
  // ordenado de Redis vía ZREVRANGE). No se pierde al salir de "últimas consultas".
  document.getElementById('sinManualTable').innerHTML = (data.sinManual || []).map(s => `
    <tr>
      <td><strong>${s.brand}</strong> ${s.model || ''} <span style="color:var(--muted)">${s.year || ''}</span></td>
      <td style="text-align:right"><strong style="color:var(--accent)">${s.count}</strong></td>
    </tr>`
  ).join('') || '<tr><td colspan="2" style="color:var(--muted);text-align:center">Sin datos — ninguna consulta se ha respondido sin manual</td></tr>';

  // Recent queries
  document.getElementById('queryList').innerHTML = data.recent.slice(0, 20).map(q =>
    `<div class="query-item">
      <span class="q-tag ${q.usedManual ? 'manual' : 'general'}">${q.usedManual ? 'manual' : 'general'}</span>
      <span class="q-moto"><strong>${q.brand}</strong> ${q.model || ''} ${q.year || ''}</span>
      <span class="q-time">${timeAgo(q.t)}</span>
    </div>`
  ).join('') || '<p style="color:var(--muted);font-size:0.875rem">Sin consultas recientes</p>';
}

document.getElementById('pwdInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
if (password) loadDashboard();
</script>
</body>
</html>
